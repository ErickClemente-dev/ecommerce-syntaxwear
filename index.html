<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <title>SyntaxWear - Ecommerce</title>
  </head>
  <body>
    <header>
      <div class="container header__inner">
        <div class="logo">
          <a href="#">SyntaxWear</a>
        </div>
        <nav aria-label="Main navigation">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#shoes">Tênis</a></li>
            <li><a href="#featured">Destaques</a></li>
            <li><a href="#contact">Contato</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section id="hero" class="hero">
        <div class="container">
          <!-- Hero content -->
        </div>
      </section>

      <section id="shoes" class="category-shoes">
        <div class="container">
          <!-- Categoria de tênis -->
        </div>
      </section>

      <section id="featured" class="product-grid">
        <div class="container">
          <!-- Grid de produtos em destaque -->
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="container footer__inner">
        <!-- Informações de contato e links -->
      </div>
    </footer>
  </body>
</html>
