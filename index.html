<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compre os melhores Tênis e Sneakers Online na SyntaxWear. Encontre modelos exclusivos para todas as ocasiões com ofertas imperdíveis e frete grátis para todo o Brasil. Compre agora e transforme seu estilo!" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components/header.css" />
    <link rel="stylesheet" href="./css/components/hero.css" />
    <link rel="stylesheet" href="./css/components/product-cards.css" />
    <title>SyntaxWear - Tênis e Sneakers Online</title>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
          <img
            src="./images/logo/logo.svg"
            alt="SyntaxWear - Tênis e Sneakers Online"
          />
        </a>
      </h1>
      <nav class="nav-center" aria-label="Categorias Principais">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Feminino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>
      <nav class="nav-right" aria-label="Acesso Rápido">
        <ul>
          <li><a href="#">Nossas Lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li>
            <a href="#" aria-label="Minha Conta">
              <img src="./images/icons/user.svg" alt="Minha Conta" />
            </a>
          </li>
          <li>
            <a href="#" aria-label="Ajuda">
              <img src="./images/icons/help.svg" alt="Ajuda" />
            </a>
          </li>
          <li>
            <a href="#" aria-label="Carrinho">
              <img src="./images/icons/bag.svg" alt="Carrinho" />
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero" class="hero">
        <div class="hero-overlay">
          <div class="hero-content">
            <span class="hero-subtitle">Krypton One</span>
            <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
            <div class="hero-buttons">
              <a href="#" class="btn btn-outline">Ver modelos</a>
              <a href="#" class="btn btn-filled">Comprar</a>
            </div>
          </div>
        </div>
      </section>

      <section id="shoes" class="category-shoes">
        <div class="container">
          <article class="product-card">
            <img src="./images/products/tênis casual.jpg" alt="Tênis Casual" />
            <div class="product-card-overlay">
              <span class="product-card-label">Casual</span>
            </div>
          </article>

          <article class="product-card">
            <img src="./images/products/tênis esporte.jpg" alt="Tênis Esporte" />
            <div class="product-card-overlay">
              <span class="product-card-label">Esporte</span>
            </div>
          </article>

          <article class="product-card">
            <img src="./images/products/tênis moderno.jpg" alt="Tênis Moderno" />
            <div class="product-card-overlay">
              <span class="product-card-label">Moderno</span>
            </div>
          </article>

          <article class="product-card">
            <img src="./images/products/tênis futurista.jpg" alt="Tênis Futurista" />
            <div class="product-card-overlay">
              <span class="product-card-label">Futurista</span>
            </div>
          </article>
        </div>
      </section>

      <section id="featured" class="product-grid">
        <div class="container">
          <!-- Grid de produtos em destaque -->
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="container footer__inner">
        <!-- Informações de contato e links -->
      </div>
    </footer>
  </body>
</html>
